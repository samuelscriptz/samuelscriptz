<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#210000"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="50%" stop-color="#ff5c5c"/>
      <stop offset="100%" stop-color="#ff1e1e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spiderGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- ===== Corner web: top-left (thick strands) ===== -->
  <g stroke="#ff2b2b" stroke-width="2.4" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M0,0 L200,105" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.1s" fill="freeze"/>
    </path>
    <path d="M0,0 L140,165" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M0,0 L70,205" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.5s" fill="freeze"/>
    </path>
    <path d="M0,0 L235,25" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.1s" begin="0s" fill="freeze"/>
    </path>
    <path d="M0,0 L20,240" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.4s" begin="0.6s" fill="freeze"/>
    </path>
  </g>
  <g stroke="#ff2b2b" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M46,5 Q70,65 6,95" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" from="150" to="0" dur="1s" begin="0.9s" fill="freeze"/>
    </path>
    <path d="M100,12 Q140,105 18,165" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.2s" begin="1.05s" fill="freeze"/>
    </path>
    <path d="M165,18 Q200,140 53,205" stroke-dasharray="340" stroke-dashoffset="340">
      <animate attributeName="stroke-dashoffset" from="340" to="0" dur="1.3s" begin="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- ===== Corner web: top-right (thick strands, mirrored) ===== -->
  <g stroke="#ff2b2b" stroke-width="2.4" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M900,0 L700,105" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.1s" fill="freeze"/>
    </path>
    <path d="M900,0 L760,165" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M900,0 L830,205" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.3s" begin="0.5s" fill="freeze"/>
    </path>
    <path d="M900,0 L665,25" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.1s" begin="0s" fill="freeze"/>
    </path>
    <path d="M900,0 L880,240" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.4s" begin="0.6s" fill="freeze"/>
    </path>
  </g>
  <g stroke="#ff2b2b" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M854,5 Q830,65 894,95" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" from="150" to="0" dur="1s" begin="0.9s" fill="freeze"/>
    </path>
    <path d="M800,12 Q760,105 882,165" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.2s" begin="1.05s" fill="freeze"/>
    </path>
    <path d="M735,18 Q700,140 847,205" stroke-dasharray="340" stroke-dashoffset="340">
      <animate attributeName="stroke-dashoffset" from="340" to="0" dur="1.3s" begin="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- ===== faint full-width connecting strands for extra web coverage ===== -->
  <g stroke="#8b0000" stroke-width="1" fill="none" opacity="0.3">
    <path d="M0,280 L280,150"/>
    <path d="M900,280 L620,150"/>
    <path d="M0,140 L900,110"/>
  </g>

  <!-- ===== Name ===== -->
  <text x="450" y="130" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="54" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="4" opacity="0">
    SAMUEL PAUL A
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>

  <text x="450" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="14" fill="#e6e6e6" letter-spacing="1.5" opacity="0">
    AI ENGINEER &#8226; FULL-STACK DEVELOPER &#8226; WEB BUILDER
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- ===== Dangling / swinging spider (clearly visible, glowing) ===== -->
  <g>
    <line x1="450" y1="0" x2="450" y2="58" stroke="#f5f5f5" stroke-width="1.4" stroke-dasharray="58" stroke-dashoffset="58" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="58" to="0" dur="1s" begin="2.6s" fill="freeze"/>
    </line>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" values="-18 450 6;18 450 6;-18 450 6"
                         dur="2.4s" begin="3.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0"
                           dur="1.6s" begin="3.6s" repeatCount="indefinite" additive="sum"/>
        <g transform="translate(450,58) scale(2.1)" filter="url(#spiderGlow)">
          <g stroke="#ff2b2b" stroke-width="1.7" fill="none" stroke-linecap="round">
            <path d="M-6,0 L-16,-4 M-16,-4 L-24,-2"/>
            <path d="M-6,4 L-17,4 M-17,4 L-25,7"/>
            <path d="M-6,8 L-15,12 M-15,12 L-21,18"/>
            <path d="M-6,11 L-12,18 M-12,18 L-16,25"/>
            <path d="M6,0 L16,-4 M16,-4 L24,-2"/>
            <path d="M6,4 L17,4 M17,4 L25,7"/>
            <path d="M6,8 L15,12 M15,12 L21,18"/>
            <path d="M6,11 L12,18 M12,18 L16,25"/>
          </g>
          <ellipse cx="0" cy="6" rx="7.5" ry="9.5" fill="#1a1a1a" stroke="#ff2b2b" stroke-width="1"/>
          <circle cx="0" cy="-6" r="5" fill="#1a1a1a" stroke="#ff2b2b" stroke-width="1"/>
          <path d="M-1.8,2 L1.8,2 L0,6 Z M-1.8,10 L1.8,10 L0,6 Z" fill="#ff2b2b"/>
          <circle cx="-1.8" cy="-7.2" r="1.1" fill="#ff3b3b"/>
          <circle cx="1.8" cy="-7.2" r="1.1" fill="#ff3b3b"/>
        </g>
      </g>
    </g>
  </g>

  <g stroke="#6e0000" stroke-width="1" fill="none" opacity="0.3">
    <path d="M0,280 L260,165"/>
    <path d="M900,280 L640,165"/>
  </g>
</svg>
