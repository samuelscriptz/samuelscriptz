<svg viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="15%" stop-color="#8b0000"/>
      <stop offset="50%" stop-color="#ff3b3b"/>
      <stop offset="85%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="20" x2="900" y2="20" stroke="url(#lineGrad)" stroke-width="1.4"
        stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="1.6s" fill="freeze"/>
  </line>
  <g fill="#ff3b3b" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <circle cx="450" cy="20" r="3.2"/>
    <path d="M450,20 L430,8 M450,20 L470,8 M450,20 L430,32 M450,20 L470,32" stroke="#ff3b3b" stroke-width="1"/>
  </g>
</svg>
