<svg viewBox="0 0 550 190" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <rect width="550" height="190" fill="#0d1117"/>
  
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.20s" fill="freeze"/>
      <circle cx="80" cy="90" r="46" fill="#170707" stroke="#ff3b3b" stroke-width="2"/>
      <circle cx="80" cy="90" r="38" fill="none" stroke="#8b0000" stroke-width="1" stroke-dasharray="4,3"><animateTransform attributeName="transform" type="rotate" from="0 80 90" to="360 80 90" dur="9s" repeatCount="indefinite"/></circle>
      <text x="80" y="86" font-size="26" text-anchor="middle">🕸️</text>
      <text x="80" y="140" font-size="12.5" font-weight="700" fill="#ff3b3b" text-anchor="middle">Web Slinger</text>
      <text x="80" y="156" font-size="10.5" fill="#8b949e" text-anchor="middle">9 repos built</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/>
      <circle cx="210" cy="90" r="46" fill="#170707" stroke="#ff3b3b" stroke-width="2"/>
      <circle cx="210" cy="90" r="38" fill="none" stroke="#8b0000" stroke-width="1" stroke-dasharray="4,3"><animateTransform attributeName="transform" type="rotate" from="0 210 90" to="360 210 90" dur="9s" repeatCount="indefinite"/></circle>
      <text x="210" y="86" font-size="26" text-anchor="middle">🕷️</text>
      <text x="210" y="140" font-size="12.5" font-weight="700" fill="#ff3b3b" text-anchor="middle">Spider-Sense</text>
      <text x="210" y="156" font-size="10.5" fill="#8b949e" text-anchor="middle">137 commits/yr</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.50s" fill="freeze"/>
      <circle cx="340" cy="90" r="46" fill="#170707" stroke="#ff3b3b" stroke-width="2"/>
      <circle cx="340" cy="90" r="38" fill="none" stroke="#8b0000" stroke-width="1" stroke-dasharray="4,3"><animateTransform attributeName="transform" type="rotate" from="0 340 90" to="360 340 90" dur="9s" repeatCount="indefinite"/></circle>
      <text x="340" y="86" font-size="26" text-anchor="middle">🌆</text>
      <text x="340" y="140" font-size="12.5" font-weight="700" fill="#ff3b3b" text-anchor="middle">Neighborhood Hero</text>
      <text x="340" y="156" font-size="10.5" fill="#8b949e" text-anchor="middle">3 languages</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.65s" fill="freeze"/>
      <circle cx="470" cy="90" r="46" fill="#170707" stroke="#ff3b3b" stroke-width="2"/>
      <circle cx="470" cy="90" r="38" fill="none" stroke="#8b0000" stroke-width="1" stroke-dasharray="4,3"><animateTransform attributeName="transform" type="rotate" from="0 470 90" to="360 470 90" dur="9s" repeatCount="indefinite"/></circle>
      <text x="470" y="86" font-size="26" text-anchor="middle">⚡</text>
      <text x="470" y="140" font-size="12.5" font-weight="700" fill="#ff3b3b" text-anchor="middle">Quick Reflexes</text>
      <text x="470" y="156" font-size="10.5" fill="#8b949e" text-anchor="middle">Active builder</text>
